name: Test Docker Hub Login

# SSH-delen er fjernet med vilje: deploy-nøglen er nu låst til én forced
# command, så enhver SSH-forbindelse ville starte et rigtigt deploy. Vil du
# teste forbindelsen, så kør "Deploy to Hetzner" manuelt i stedet.
on:
  workflow_dispatch: # This allows you to trigger it manually for testing

permissions:
  contents: read

jobs:
  test-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Success Message
        run: echo "Docker Hub Login Successful!"
