{% extends "components/booking_list.html" %}

{% block booking_list_toolbar %}
<div class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="">Alle statusser</option>
                    {% for status_value, status_label in status_choices %}
                    <option value="{{ status_value }}" {% if selected_status == status_value %}selected{% endif %}>{{ status_label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Vare</label>
                <select name="item" class="form-select">
                    <option value="">Alle varer</option>
                    {% for depot_item in filter_items %}
                    <option value="{{ depot_item.pk }}" {% if selected_item == depot_item.pk|stringformat:"s" %}selected{% endif %}>{{ depot_item.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Hold</label>
                <select name="team" class="form-select">
                    <option value="">Alle hold</option>
                    {% for team in filter_teams %}
                    <option value="{{ team.pk }}" {% if selected_team == team.pk|stringformat:"s" %}selected{% endif %}>{{ team.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-funnel"></i> Filter
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
