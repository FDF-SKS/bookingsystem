{% load static %}
<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FF733C">
    <meta name="robots" content="noindex">
    <title>Offline · SKS Booking</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.5;
            color: #212529;
            background: #ffffff;
        }
        .card {
            width: min(26rem, 100%);
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px solid #e9ecef;
            border-radius: 1.25rem;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.08);
        }
        .icon {
            display: inline-flex;
            width: 5rem;
            height: 5rem;
            margin-bottom: 1rem;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2rem;
            background: rgba(255, 115, 60, 0.15);
            color: #c2410c;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
        p { margin: 0 0 0.75rem; color: #6c757d; font-size: 0.95rem; }
        .stamp { font-size: 0.8rem; }
        a.button {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.6rem 1.4rem;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: #003255;
        }
        @media (prefers-color-scheme: dark) {
            body { color: #e9ecef; background: #23272b; }
            .card { border-color: rgba(255, 255, 255, 0.12); }
            p { color: #9aa5ad; }
            a.button { color: #23272b; background: #ff733c; }
            .icon { color: #ff9a6b; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">⚡</div>
        <h1>Du er offline</h1>
        <p>
            Denne side er ikke gemt på telefonen endnu. Sider, du har åbnet
            tidligere, kan stadig vises uden forbindelse.
        </p>
        <p class="stamp" data-offline-last-updated>
            Der er endnu ikke gemt data til offline brug.
        </p>
        <a class="button" href="/">Prøv igen</a>
    </main>
    <script src="{% static 'js/pwa.js' %}" data-sw-url="{% url 'pwa_service_worker' %}"></script>
</body>
</html>
