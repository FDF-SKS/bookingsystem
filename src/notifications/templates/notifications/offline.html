{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width: 88px; height: 88px;">
                <i class="bi bi-wifi-off fs-1" aria-hidden="true"></i>
            </div>
            <h1 class="h3 mb-2">Du er offline</h1>
            <p class="text-muted">
                Appen kan ikke nå serveren lige nu. Din kalender og dine notifikationer
                virker stadig, men siderne kræver en internetforbindelse.
            </p>
            <a href="{% url 'index' %}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i> Prøv igen
            </a>
        </div>
    </div>
</div>
{% endblock %}
