{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 560px;">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold mb-3">Slet hold</h1>
            <p>Er du sikker på, at du vil slette holdet <strong>{{ object.name }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Ja, slet</button>
                    {% if object and object.loeb %}
                        <a href="{% url 'Loeb_Loeb_detail' object.loeb.pk %}" class="btn btn-outline-secondary">Annuller</a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
