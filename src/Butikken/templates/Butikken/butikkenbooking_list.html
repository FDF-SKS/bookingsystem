{% extends "components/booking_list.html" %}

{% block booking_list_toolbar %}
<div class="d-flex justify-content-end mb-3">
    <div class="btn-group btn-group-sm" role="group">
        <a href="?sort=item" class="btn {% if current_sort == 'item' %}btn-primary{% else %}btn-outline-secondary{% endif %}" title="Sortér efter vare navn">Vare A-Z</a>
        <a href="?sort=-item" class="btn {% if current_sort == '-item' %}btn-primary{% else %}btn-outline-secondary{% endif %}" title="Sortér efter vare navn omvendt">Vare Z-A</a>
        <a href="?sort=start_date" class="btn {% if current_sort == 'start_date' %}btn-primary{% else %}btn-outline-secondary{% endif %}" title="Sortér efter dato, tidligst først">Dato ↑</a>
        <a href="?sort=-start_date" class="btn {% if current_sort == '-start_date' %}btn-primary{% else %}btn-outline-secondary{% endif %}" title="Sortér efter dato, senest først">Dato ↓</a>
    </div>
</div>
{% endblock %}
