# 1. HTTP -> HTTPS for canonical host
server {
    listen 80;
    server_name booking.markusglavind.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1b. HTTP -> HTTPS and redirect old host to canonical
server {
    listen 80;
    server_name booking.seniorkursussletten.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to canonical host over HTTPS
    location / {
        return 301 https://booking.markusglavind.dk$request_uri;
    }
}

# 2. HTTPS Server for canonical host
server {
    listen 443 ssl;
    server_name booking.markusglavind.dk;

    ssl_certificate /etc/letsencrypt/live/booking.markusglavind.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.markusglavind.dk/privkey.pem;

    # Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
    }

    location /media/ {
        alias /var/www/media/;
    }
}

# 2b. HTTPS: present correct cert for the old hostname and redirect to canonical
server {
    listen 443 ssl;
    server_name booking.seniorkursussletten.dk;

    ssl_certificate /etc/letsencrypt/live/booking.seniorkursussletten.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.seniorkursussletten.dk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # Present cert, then redirect to canonical host
    return 301 https://booking.markusglavind.dk$request_uri;
}
